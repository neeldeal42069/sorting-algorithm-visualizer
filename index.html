<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🔀 Sorting Algorithm Visualizer</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="algorithm">Algorithm:</label>
                <select id="algorithm">
                    <option value="bubble">Bubble Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="quick">Quick Sort</option>
                    <option value="heap">Heap Sort</option>
                </select>
            </div>

            <div class="control-group">
                <label for="arraySize">Array Size: <span id="sizeDisplay">50</span></label>
                <input type="range" id="arraySize" min="10" max="300" value="50">
            </div>

            <div class="control-group">
                <label for="speed">Speed: <span id="speedDisplay">50</span></label>
                <input type="range" id="speed" min="1" max="100" value="50">
            </div>

            <div class="button-group">
                <button id="generateBtn" class="btn btn-primary">Generate Array</button>
                <button id="startBtn" class="btn btn-success">Start Sort</button>
                <button id="resetBtn" class="btn btn-danger">Reset</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Comparisons:</span>
                <span class="stat-value" id="comparisons">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Swaps:</span>
                <span class="stat-value" id="swaps">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Time (ms):</span>
                <span class="stat-value" id="time">0</span>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #667eea;"></div>
                <span>Unsorted</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #ff6b6b;"></div>
                <span>Comparing</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #51cf66;"></div>
                <span>Sorted</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #ffd93d;"></div>
                <span>Pivot</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
